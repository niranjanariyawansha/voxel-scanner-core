# Tiny Tapeout project information
# NOTE: The following lines are CRITICAL. Do not delete them.
yaml_version: 6
project_id: 0        

# The documentation section
project:
  title:        "Voxel JSON Accelerator"
  author:       "Niranjan Ariyawansha"
  discord:      ""      
  description:  "A 64-bit parallel JSON structural scanner running on FPGA/ASIC."
  language:     "Verilog"
  clock_hz:     50000000  # 50 MHz base clock for simulation

  # Tiles occupied: 1x1
  tiles: "1x1"          

  # Top module name
  top_module:  "tt_um_niranjanariyawansha_voxel_scanner_core"

  # The source files for your design
  source_files:
    - "tt_um_niranjanariyawansha_voxel_scanner_core.v"
    - "vx1_pmu.v"  # <--- NEW FILE ADDED FOR PMU GLORY LOGIC

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "Input Data Bit 0 (Replicated to 64-bit)"
  ui[1]: "Input Data Bit 1 (Replicated to 64-bit)"
  ui[2]: "Input Data Bit 2 (Replicated to 64-bit)"
  ui[3]: "Input Data Bit 3 (Replicated to 64-bit)"
  ui[4]: "Input Data Bit 4 (Replicated to 64-bit)"
  ui[5]: "Input Data Bit 5 (Replicated to 64-bit)"
  ui[6]: "Input Data Bit 6 (Replicated to 64-bit)"
  ui[7]: "Input Data Bit 7 (Replicated to 64-bit)"

  # Outputs
  uo[0]: "Structure Bitmap Bit 0"
  uo[1]: "Structure Bitmap Bit 1"
  uo[2]: "Structure Bitmap Bit 2"
  uo[3]: "Structure Bitmap Bit 3"
  uo[4]: "Structure Bitmap Bit 4"
  uo[5]: "Structure Bitmap Bit 5"
  uo[6]: "Structure Bitmap Bit 6"
  uo[7]: "Structure Bitmap Bit 7"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Documentation configuration
documentation: 
  inputs:
    - "ui_in"
  outputs:
    - "uo_out"
    - "uio_out"
    - "uio_oe"
  bidirectional:
    - "uio_in"
