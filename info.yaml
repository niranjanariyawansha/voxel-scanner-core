# Tiny Tapeout project information
#
# As everyone will have access to all designs, try to make it easy for someone new to your design to know what
# it does and how to operate it. This info will be automatically collected and used to make a datasheet for the chip.
#
# Here is a great example: https://github.com/TinyTapeout/tinytapeout/blob/main/INFO_0000.md
#
# NOTE: The following lines are CRITICAL. Do not delete them.
yaml_version: 6
project_id: 0        # Leave this as 0. The robot assigns a real ID later.

# The documentation section
project:
  title:        "Voxel JSON Accelerator"
  author:       "Niranjan Ariyawansha"
  discord:      ""      # Optional: Your discord username if you want
  description:  "A 64-bit parallel JSON structural scanner running on FPGA/ASIC."
  language:     "Verilog"
  clock_hz:     50000000  # 50 MHz

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # 1x1 is the standard free size

  # What is the top module name?
  # This MUST match the module name in your Verilog file exactly.
  top_module:  "tt_um_niranjanariyawansha_voxel_scanner_core"

  # The source files for your design
  source_files:
    - "tt_um_niranjanariyawansha_voxel_scanner_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "Input Data Bit 0 (Replicated to 64-bit)"
  ui[1]: "Input Data Bit 1 (Replicated to 64-bit)"
  ui[2]: "Input Data Bit 2 (Replicated to 64-bit)"
  ui[3]: "Input Data Bit 3 (Replicated to 64-bit)"
  ui[4]: "Input Data Bit 4 (Replicated to 64-bit)"
  ui[5]: "Input Data Bit 5 (Replicated to 64-bit)"
  ui[6]: "Input Data Bit 6 (Replicated to 64-bit)"
  ui[7]: "Input Data Bit 7 (Replicated to 64-bit)"

  # Outputs
  uo[0]: "Structure Bitmap Bit 0"
  uo[1]: "Structure Bitmap Bit 1"
  uo[2]: "Structure Bitmap Bit 2"
  uo[3]: "Structure Bitmap Bit 3"
  uo[4]: "Structure Bitmap Bit 4"
  uo[5]: "Structure Bitmap Bit 5"
  uo[6]: "Structure Bitmap Bit 6"
  uo[7]: "Structure Bitmap Bit 7"

  # Bidirectional pins (We are not using these, so leave them blank)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change the following values
documentation: 
  inputs:
    - "ui_in"
  outputs:
    - "uo_out"
    - "uio_out"
    - "uio_oe"
  bidirectional:
    - "uio_in"
